name: Feature request
description: An idea for bonestats.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: bonestats stays small on purpose (one binary, one SQLite file, a ~1.2 KB script), so tell us about the problem first, not only the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and why bonestats doesn't let you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you'd like it to work.
