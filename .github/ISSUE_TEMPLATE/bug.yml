name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, don't open an issue. Follow SECURITY.md and report privately instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start bonestats with ...
        2. Open ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. 0.1.0) or commit.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker Compose (with Caddy), Docker image, Release binary, Built from source]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines around the problem. Remove domains or IPs you don't want to share.
      render: text
